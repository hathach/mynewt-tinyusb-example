name: Build

on: [pull_request, push, repository_dispatch]
env:
  MYNEWT_VERSION: 1.14.0
  TOOLCHAIN_URL: https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ['pca10056']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Toolchain
      run: |
        wget --progress=dot:giga ${{ env.TOOLCHAIN_URL }} -O toolchain.tar.gz
        mkdir -p toolchain
        tar -C toolchain/ -xaf toolchain.tar.gz
        echo >> $GITHUB_PATH `echo $GITHUB_WORKSPACE/toolchain/*/bin`

    - name: Install newt
      run: |
        wget --progress=dot:giga https://www.apache.org/dyn/closer.lua/mynewt/apache-mynewt-${{ env.MYNEWT_VERSION }}/apache-mynewt-newt-bin-linux-${{ env.MYNEWT_VERSION }}.tgz?action=download -O mynewt-newt-bin.tgz
        mkdir -p mynewt-newt
        tar -C mynewt-newt/ -xaf mynewt-newt-bin.tgz
        ls mynewt-newt/
        echo "$GITHUB_WORKSPACE/mynewt-newt/apache-mynewt-newt-bin-linux-${{ env.MYNEWT_VERSION }}" >> $GITHUB_PATH

    - name: Build
      run: |
        arm-none-eabi-gcc --version
        newt version
        newt upgrade
        newt build ${{ matrix.board }}-cdc_msc
        newt build ${{ matrix.board }}-msc_dual_lun
        newt build ${{ matrix.board }}-blehci
