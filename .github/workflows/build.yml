name: Build

on: [pull_request, push, repository_dispatch]
env:
  MYNEWT_VERSION: 1.13.0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ['pca10056']
    steps:
    - name: Install ARM GCC
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '14.2.Rel1'

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install newt
      run: |
        wget --progress=dot:giga https://dlcdn.apache.org/mynewt/apache-mynewt-${{ env.MYNEWT_VERSION }}/apache-mynewt-newt-bin-linux-${{ env.MYNEWT_VERSION }}.tgz -O mynewt-newt-bin.tgz
        mkdir -p mynewt-newt
        tar -C mynewt-newt/ -xaf mynewt-newt-bin.tgz
        ls mynewt-newt/
        echo "$GITHUB_WORKSPACE/mynewt-newt/apache-mynewt-newt-bin-linux-${{ env.MYNEWT_VERSION }}" >> $GITHUB_PATH

    - name: Build
      run: |
        newt version
        newt upgrade
        newt build ${{ matrix.board }}-cdc_msc
        newt build ${{ matrix.board }}-msc_dual_lun
        newt build ${{ matrix.board }}-blehci
